syntax = "proto3";

package layout.api.error;

import "errorsx/errors.proto";

option go_package = "./;errors";

enum ErrorReason {
  option (errors.default_code) = 500;

  ParamsError = 0 [
    (errors.code) = 500,
    (errors.message) = "参数错误"
  ];
  SystemError = 1 [
    (errors.code) = 500,
    (errors.message) = "系统错误"
  ];
  DatabaseError = 2 [
    (errors.code) = 500,
    (errors.message) = "数据库错误"
  ];
  TransformError = 3 [
    (errors.code) = 500,
    (errors.message) = "数据转换失败"
  ];
  GetError = 4 [
    (errors.code) = 500,
    (errors.message) = "获取数据失败"
  ];
  ListError = 5 [
    (errors.code) = 500,
    (errors.message) = "获取列表数据失败"
  ];
  CreateError = 6 [
    (errors.code) = 500,
    (errors.message) = "创建数据失败"
  ];
  ImportError = 7 [
    (errors.code) = 500,
    (errors.message) = "导入数据失败"
  ];
  UpdateError = 8 [
    (errors.code) = 500,
    (errors.message) = "更新数据失败"
  ];
  DeleteError = 9 [
    (errors.code) = 500,
    (errors.message) = "删除数据失败"
  ];
}
