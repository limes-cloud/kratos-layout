syntax = "proto3";

package partyaffairs.api.chat;
option go_package = "kratos-layout/api/chat;chat";
option java_multiple_files = true;
option java_package = "partyaffairs.api.chat";

import "validate/validate.proto";
import "google/api/annotations.proto";
import "api/chat/proto/chat.proto";

service Chat{

  // GetChatSetting 获取chatbot setting
  rpc GetChatSetting (GetChatSettingRequest) returns (GetChatSettingReply) {
    option (google.api.http) = {
      get: "/partyaffairs/api/v1/chat/setting",
    };
  }

  // ListChatRecord 获取会话记录信息列表
  rpc ListChatRecord (ListChatRecordRequest) returns (ListChatRecordReply) {
    option (google.api.http) = {
      get: "/partyaffairs/api/v1/chat/records",
    };
  }

  // DeleteChatRecord 删除会话记录信息
  rpc DeleteChatRecord (DeleteChatRecordRequest) returns (DeleteChatRecordReply) {
    option (google.api.http) = {
      delete: "/partyaffairs/api/v1/chat/record",
    };
  }

}